name: Build for Linux ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Fail if branch is not master
        if: github.ref != 'refs/heads/main'
        run: |
          echo "This workflow can only be run on master branch to ensure code-signed builds come from merged PRs"
          exit 1

      - uses: actions/checkout@v7

      - name: Install system deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            software-properties-common \
            autoconf automake build-essential clang cmake fakeroot git \
            libc-ares-dev libctemplate-dev libcurl4-openssl-dev libglib2.0-dev \
            libicu-dev libsasl2-dev libsasl2-modules libsasl2-modules-gssapi-mit \
            libsecret-1-dev libssl-dev libnss3 libnss3-dev libtidy-dev libtool \
            libxext-dev libxkbfile-dev libxml2-dev libxtst-dev pkg-config rpm \
            uuid-dev xvfb
          # Note: execstack is not available on ARM64 and not needed for aarch64 binaries.

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci
        working-directory: .

      # The packager copies whatever mailsync binary sits in app/. postinstall only warns
      # when it's missing, so fetch this fork's release engine before building.
      - name: Fetch Sync Engine
        run: npm run fetch-mailsync

      - name: Setup AWS CLI
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
          aws configure set default.region fsn1

      - name: Lint
        run: npm run lint:check

      - name: Build
        run: DEBUG=electron-packager npm run build

      - name: Sync Artifacts to S3
        run: |
          aws s3 sync app/dist/ "s3://dd-596-veles/client/$(git rev-parse --short=8 HEAD)/linux-arm64" \
            --endpoint-url https://s3.danubedata.ro \
            --acl public-read \
            --exclude "*" --include "*.deb" --include "*.rpm"

      - name: Upload DEB artifact for testing
        uses: actions/upload-artifact@v7
        with:
          name: nuncio-arm64-deb
          path: app/dist/*.deb
          retention-days: 1

      - name: Upload RPM artifact for testing
        uses: actions/upload-artifact@v7
        with:
          name: nuncio-arm64-rpm
          path: app/dist/*.rpm
          retention-days: 1

  test-ubuntu:
    needs: build
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        ubuntu_version: ['22.04', '24.04', '25.04']
    steps:
      - name: Download DEB artifact
        uses: actions/download-artifact@v8
        with:
          name: nuncio-arm64-deb

      - name: Test installation on Ubuntu ${{ matrix.ubuntu_version }} (arm64)
        run: |
          docker run --rm --platform linux/arm64 -v ${{ github.workspace }}:/workspace ubuntu:${{ matrix.ubuntu_version }} bash -c "
            set -e
            echo '=== Testing Nuncio ARM64 installation on Ubuntu ${{ matrix.ubuntu_version }} ==='

            cd /workspace
            export DEBIAN_FRONTEND=noninteractive
            apt-get update

            dpkg -i *.deb || true
            apt-get install -f -y
            apt-get install -y xvfb file

            dpkg -l | grep nuncio || (echo '✗ Nuncio package not installed' && exit 1)
            which nuncio || (echo '✗ nuncio binary not found in PATH' && exit 1)

            echo 'Installed files:'
            dpkg -L nuncio | head -20

            echo 'Verifying ARM64 binary...'
            file /usr/share/nuncio/nuncio | grep -iE 'aarch64|arm'
            echo '✓ ARM64 binary confirmed'

            echo 'Running nuncio --version...'
            xvfb-run -a nuncio --version --no-sandbox > /tmp/version.txt 2>&1 || true
            cat /tmp/version.txt

            if grep -qE '[0-9]+\.[0-9]+\.[0-9]+' /tmp/version.txt; then
              echo '✓ nuncio --version passed on Ubuntu ${{ matrix.ubuntu_version }} arm64'
            else
              echo '✗ nuncio --version failed on Ubuntu ${{ matrix.ubuntu_version }} arm64'
              exit 1
            fi

            # Verify mailsync binary exists
            if [ -f /usr/share/nuncio/mailsync ]; then
              MAILSYNC_PATH=/usr/share/nuncio/mailsync
            elif [ -f /usr/share/nuncio/mailsync.bin ]; then
              MAILSYNC_PATH=/usr/share/nuncio/mailsync.bin
            elif [ -f /usr/share/nuncio/resources/app.asar.unpacked/mailsync ]; then
              MAILSYNC_PATH=/usr/share/nuncio/resources/app.asar.unpacked/mailsync
            elif [ -f /usr/share/nuncio/resources/app.asar.unpacked/mailsync.bin ]; then
              MAILSYNC_PATH=/usr/share/nuncio/resources/app.asar.unpacked/mailsync.bin
            else
              echo '✗ mailsync binary not found'
              ls -la /usr/share/nuncio/ | head -30
              exit 1
            fi

            echo 'Running mailsync --help...'
            \$MAILSYNC_PATH --help > /tmp/mailsync-help.txt 2>&1 || true
            cat /tmp/mailsync-help.txt

            if grep -qiE 'usage|help|mailsync|options|--mode' /tmp/mailsync-help.txt; then
              if grep -qi 'error' /tmp/mailsync-help.txt; then
                echo '✗ mailsync --help contains errors on Ubuntu ${{ matrix.ubuntu_version }} arm64'
                exit 1
              fi
              echo '✓ mailsync --help passed on Ubuntu ${{ matrix.ubuntu_version }} arm64'
            else
              echo '✗ mailsync --help failed on Ubuntu ${{ matrix.ubuntu_version }} arm64'
              exit 1
            fi

            echo '✓ Nuncio ARM64 installation test passed on Ubuntu ${{ matrix.ubuntu_version }}'
          "

  test-fedora:
    needs: build
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        fedora_version: ['40', '41', '43']
    steps:
      - name: Download RPM artifact
        uses: actions/download-artifact@v8
        with:
          name: nuncio-arm64-rpm

      - name: Test installation on Fedora ${{ matrix.fedora_version }} (arm64)
        run: |
          docker run --rm --platform linux/arm64 -v ${{ github.workspace }}:/workspace fedora:${{ matrix.fedora_version }} bash -c "
            set -e
            echo '=== Testing Nuncio ARM64 installation on Fedora ${{ matrix.fedora_version }} ==='

            cd /workspace
            dnf install -y xorg-x11-server-Xvfb which alsa-lib

            dnf install -y *.rpm

            rpm -q nuncio || (echo '✗ Nuncio package not installed' && exit 1)
            which nuncio || (echo '✗ nuncio binary not found in PATH' && exit 1)

            echo 'Installed files:'
            rpm -ql nuncio | head -20

            echo 'Running nuncio --version...'
            xvfb-run -a nuncio --version --no-sandbox > /tmp/version.txt 2>&1 || true
            cat /tmp/version.txt

            if grep -qE '[0-9]+\.[0-9]+\.[0-9]+' /tmp/version.txt; then
              echo '✓ nuncio --version passed on Fedora ${{ matrix.fedora_version }} arm64'
            else
              echo '✗ nuncio --version failed on Fedora ${{ matrix.fedora_version }} arm64'
              exit 1
            fi

            # Verify mailsync binary exists
            if [ -f /usr/share/nuncio/mailsync ]; then
              MAILSYNC_PATH=/usr/share/nuncio/mailsync
            elif [ -f /usr/share/nuncio/mailsync.bin ]; then
              MAILSYNC_PATH=/usr/share/nuncio/mailsync.bin
            elif [ -f /usr/share/nuncio/resources/app.asar.unpacked/mailsync ]; then
              MAILSYNC_PATH=/usr/share/nuncio/resources/app.asar.unpacked/mailsync
            elif [ -f /usr/share/nuncio/resources/app.asar.unpacked/mailsync.bin ]; then
              MAILSYNC_PATH=/usr/share/nuncio/resources/app.asar.unpacked/mailsync.bin
            elif [ -f /usr/local/share/nuncio/mailsync ]; then
              MAILSYNC_PATH=/usr/local/share/nuncio/mailsync
            elif [ -f /usr/local/share/nuncio/mailsync.bin ]; then
              MAILSYNC_PATH=/usr/local/share/nuncio/mailsync.bin
            else
              echo '✗ mailsync binary not found'
              rpm -ql nuncio | grep -i mailsync || echo 'No mailsync found in package'
              ls -la /usr/share/nuncio/ | head -30
              exit 1
            fi

            echo 'Running mailsync --help...'
            \$MAILSYNC_PATH --help > /tmp/mailsync-help.txt 2>&1 || true
            cat /tmp/mailsync-help.txt

            if grep -qiE 'usage|help|mailsync|options|--mode' /tmp/mailsync-help.txt; then
              if grep -qi 'error' /tmp/mailsync-help.txt; then
                echo '✗ mailsync --help contains errors on Fedora ${{ matrix.fedora_version }} arm64'
                exit 1
              fi
              echo '✓ mailsync --help passed on Fedora ${{ matrix.fedora_version }} arm64'
            else
              echo '✗ mailsync --help failed on Fedora ${{ matrix.fedora_version }} arm64'
              exit 1
            fi

            echo '✓ Nuncio ARM64 installation test passed on Fedora ${{ matrix.fedora_version }}'
          "
