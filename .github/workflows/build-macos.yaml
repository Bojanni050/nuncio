name: Build for macOS

on:
  workflow_dispatch:

jobs:
  build-macos:
    strategy:
      matrix:
        include:
          - os: macos-26
            arch: arm64
          - os: macos-26-intel
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Fail if branch is not main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "This workflow should not be triggered with workflow_dispatch on a branch other than main"
          exit 1

      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Cache NodeJS modules
        uses: actions/cache@v6
        with:
          path: |
            ./node_modules
            ./app/node_modules
          key: ${{ matrix.os }}-${{ runner.arch }}-deps-${{ hashFiles('yarn.lock') }}-${{ hashFiles('app/package-lock.json') }}

      - name: Install Dependencies
        run: npm ci

      # The packager copies whatever mailsync binary sits in app/. postinstall only warns
      # when it's missing, so fetch this fork's release engine before building.
      - name: Fetch Sync Engine
        run: npm run fetch-mailsync

      - name: Setup Codesigning
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CODESIGN_P12 }}
          p12-password: ${{ secrets.APPLE_CODESIGN_KEY_PASSWORD }}

      - name: Setup Provisioning Profile
        run: |
          echo "APPLE_PROVISIONING_PROFILE_PATH=${{ runner.temp }}/Nuncio.provisionprofile" >> $GITHUB_ENV
          echo $APPLE_PROVISIONING_PROFILE_B64 | base64 --decode > "${{ runner.temp }}/Nuncio.provisionprofile"
        env:
          APPLE_PROVISIONING_PROFILE_B64: ${{ secrets.APPLE_PROVISIONING_PROFILE_B64 }}

      - name: Setup AWS CLI
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
          aws configure set default.region fsn1

      - name: Lint
        run: npm run lint:check

      - name: Build
        run: SIGN_BUILD=true DEBUG=electron-packager,electron-osx-sign,electron-notarize* npm run build
        env:
          APPLE_ID_ASC_PROVIDER: ${{ secrets.APPLE_ID_ASC_PROVIDER }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_PATH: ${{ env.APPLE_PROVISIONING_PROFILE_PATH }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      - name: Rename artifacts
        if: matrix.arch == 'arm64'
        run: |
          mv app/dist/Nuncio.zip app/dist/Nuncio-AppleSilicon.zip

      - name: Sync artifacts to S3 bucket
        run: |
          aws s3 sync app/dist/ "s3://dd-596-veles/client/$(git rev-parse --short=8 HEAD)/osx" \
            --endpoint-url https://s3.danubedata.ro \
            --acl public-read \
            --exclude "*" --include *.zip
